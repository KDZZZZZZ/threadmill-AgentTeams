services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: threadmill
      POSTGRES_USER: threadmill
      POSTGRES_PASSWORD: threadmill
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadmill -d threadmill"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: threadmill
      MINIO_ROOT_PASSWORD: threadmill-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
