name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Reserved
        run: echo "web build/test job reserved for the future web/ workspace"
